# Groups the notes that "gh release create --generate-notes" builds from merged pull requests, by label
changelog:
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Dependency updates
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
