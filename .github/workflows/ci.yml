name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run, so a new Trino release is tested through the "latest" entries without a code change
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # Called by the release workflow, which publishes the artifact built and tested here
  workflow_call:
    inputs:
      revision:
        description: Version to build, for example 1.2.3
        type: string
        required: true

concurrency:
  # Only pull request runs are replaced by newer pushes; main and release runs always finish
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  # Static checks, all bound to the Maven build so "mvn verify" runs the same checks locally:
  # formatting (Airstyle), Checkstyle, license headers, compiler warnings as errors, Error Prone,
  # Modernizer, dependency analysis, and Maven/Java version requirements.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven checks
        run: mvn verify -DskipTests

      - name: Lint GitHub Actions workflows
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Validate the local environment
        run: docker compose --file dev/docker-compose.yml config --quiet

  # Builds the plugin zip that is tested by every other job and, for a release, published.
  # The plugin is compiled against the oldest supported Trino version (dep.trino.version in pom.xml).
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Compiler warnings and Error Prone still apply; the other checks run in the Checks job.
      # The commit time as build timestamp makes the zip reproducible from the same commit.
      - name: Build, unit tests, Keycloak integration tests
        env:
          REVISION: ${{ inputs.revision }}
        run: >-
          mvn verify -Dchecks.skip -Dit.test=KeycloakScimGroupProviderIT
          -Dproject.build.outputTimestamp="$(git log -1 --format=%ct)"
          ${REVISION:+-Drevision="$REVISION"}

      - id: zip
        run: echo "name=$(basename target/trino-scim-group-provider-*.zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: target/${{ steps.zip.outputs.name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-build
          path: target/*-reports/

  setup:
    name: Read compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      trino: ${{ steps.versions.outputs.trino }}
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: echo "trino=$(jq --compact-output .trino .github/compatibility.json)" >> "$GITHUB_OUTPUT"

  # Loads the zip from the build job, byte for byte, into each trinodb/trino image and runs queries against Keycloak
  compatibility:
    name: Trino ${{ matrix.trino }}
    needs: [checks, build, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trino: ${{ fromJSON(needs.setup.outputs.trino) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/download-artifact@v8
        with:
          name: plugin
          path: dist

      # Compiles the tests only; the plugin under test is the downloaded zip
      - name: Run Trino integration tests
        env:
          TRINO_VERSION: ${{ matrix.trino }}
          PLUGIN_ZIP: ${{ github.workspace }}/dist/${{ needs.build.outputs.zip }}
        run: >-
          mvn verify -Dchecks.skip
          -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=TrinoCompatibilityIT
          -Dtrino.test.version="$TRINO_VERSION" -Dplugin.zip="$PLUGIN_ZIP"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-trino-${{ matrix.trino }}
          path: target/failsafe-reports/

  # Single status to mark as required in branch protection, since the matrix job names change with
  # .github/compatibility.json. Fails unless every integration test job succeeded: a job skipped
  # because a job it needs failed (for example Checks) counts as a failure.
  integration-tests:
    name: Integration tests
    needs: [build, compatibility]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check integration test results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::Some integration tests did not succeed"
            exit 1
          fi

  # Compiles against the newest Trino release, to find source incompatibilities before
  # the minimum supported version has to be raised. Not run for releases: the released
  # artifact is built against the oldest supported version.
  latest-trino-sources:
    name: Build against latest Trino
    if: ${{ !inputs.revision }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Find latest Trino release
        id: trino
        run: |
          version=$(curl -fsS https://repo1.maven.org/maven2/io/trino/trino-spi/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          jdk=$(curl -fsS "https://repo1.maven.org/maven2/io/trino/trino-root/${version}/trino-root-${version}.pom" | sed -n 's:.*<project.build.targetJdk>\(.*\)</project.build.targetJdk>.*:\1:p' | head -n 1)
          echo "Latest Trino release: ${version} (Java ${jdk})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "jdk=${jdk}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          TRINO_VERSION: ${{ steps.trino.outputs.version }}
          TRINO_JDK: ${{ steps.trino.outputs.jdk }}
        run: >-
          mvn verify
          -Ddep.trino.version="$TRINO_VERSION"
          -Dproject.build.targetJdk="$TRINO_JDK"
          -Dtrino.test.version="$TRINO_VERSION"
