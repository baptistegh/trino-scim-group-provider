name: Release

# Push a tag to release: git tag -s v1.2.3 -m v1.2.3 && git push origin v1.2.3
# A tag with a suffix, such as v1.2.3-rc.1, creates a pre-release.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-SUFFIX"
            exit 1
          fi
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # The full CI: checks, unit tests, and the artifact loaded into every Trino version of the matrix
  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.version.outputs.version }}

  # Uploads to Maven Central and waits for Central to validate the deployment. Publishing it is manual:
  # https://central.sonatype.com/publishing/deployments, since a version on Central can never be changed or removed.
  maven-central:
    name: Upload to Maven Central
    needs: [version, ci]
    runs-on: ubuntu-latest
    env:
      MAVEN_ARGS: --batch-mode --no-transfer-progress
    steps:
      - uses: actions/checkout@v7

      # Writes the "central" server credentials to settings.xml and imports the signing key
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: actions/download-artifact@v8
        with:
          name: plugin
          path: dist

      # The build is reproducible: the rebuilt zip must be the exact zip that passed CI
      - name: Check the rebuilt zip is the tested one
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mvn package -Prelease -DskipTests -Dchecks.skip \
            -Drevision="$VERSION" -Dproject.build.outputTimestamp="$(git log -1 --format=%ct)"
          zip="trino-scim-group-provider-${VERSION}.zip"
          tested=$(sha256sum "dist/$zip" | cut -d' ' -f1)
          rebuilt=$(sha256sum "target/$zip" | cut -d' ' -f1)
          echo "tested:  $tested"
          echo "rebuilt: $rebuilt"
          if [[ "$tested" != "$rebuilt" ]]; then
            echo "::error::The rebuilt zip differs from the zip tested in CI"
            exit 1
          fi

      - name: Sign and upload
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mvn deploy -Prelease -DskipTests -Dchecks.skip
          -Drevision="$VERSION" -Dproject.build.outputTimestamp="$(git log -1 --format=%ct)"

  publish:
    name: Publish GitHub release
    needs: [version, ci, maven-central]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # The exact zip that passed CI
      - uses: actions/download-artifact@v8
        with:
          name: plugin
          path: dist

      - name: Checksum
        working-directory: dist
        run: |
          for zip in *.zip; do
            sha256sum "$zip" > "$zip.sha256"
          done
          cat ./*.sha256

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest=$(curl -fsS https://repo1.maven.org/maven2/io/trino/trino-spi/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          trino=$(jq --raw-output --arg latest "$latest" '[.trino[] | if . == "latest" then $latest else . end] | unique_by(tonumber) | join(", ")' .github/compatibility.json)
          minimum=$(sed -n 's:.*<dep.trino.version>\(.*\)</dep.trino.version>.*:\1:p' pom.xml)
          keycloak=$(sed -n 's:.*<keycloak.test.image>.*\:\(.*\)</keycloak.test.image>.*:\1:p' pom.xml)
          zip="trino-scim-group-provider-${VERSION}.zip"
          cat > notes.md <<EOF
          ## Compatibility

          - Trino ${minimum} and later. This artifact was tested with Trino ${trino}.
          - Tested with Keycloak ${keycloak}. Other SCIM 2.0 services that return \`groups\` on User resources should work.

          ## Installation

          Unzip \`${zip}\` into the plugin directory of every Trino node, for example \`/usr/lib/trino/plugin/scim-group-provider/\`,
          and configure \`etc/group-provider.properties\` as described in the [README](https://github.com/${REPOSITORY}/blob/v${VERSION}/README.md).

          The same artifacts are on Maven Central as \`io.github.baptistegh:trino-scim-group-provider:${VERSION}\`
          (the zip has type \`zip\`), once the deployment is published there.

          Verify the download:

          \`\`\`shell
          sha256sum --check ${zip}.sha256
          gh attestation verify ${zip} --repo ${REPOSITORY}
          \`\`\`

          EOF
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            "${args[@]}"
